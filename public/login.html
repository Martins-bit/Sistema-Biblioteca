<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Sistema Biblioteca</title>
  <style>
     :root{
       --primary:#22C55E;
       --primary-dark:#15803D;
       --bg:#F8FAFC;
       --card:#FFFFFF;
       --border:#E5E7EB;
       --text:#1F2937;
       --muted:#6B7280;
       --danger:#ef4444;
       --danger-dark:#dc2626;
       --shadow-sm:0 1px 2px rgba(16,24,40,.06);
       --shadow:0 24px 60px rgba(16,24,40,.14);
       --radius:20px;
     }
     *{box-sizing:border-box;}
     html,body{height:100%;}
     body{
       margin:0;
       font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:
         radial-gradient(1100px 620px at 8% -12%, rgba(34,197,94,.16), transparent 60%),
         radial-gradient(900px 560px at 112% 112%, rgba(59,130,246,.12), transparent 60%),
         var(--bg);
       color:var(--text);
       overflow-x:hidden;
     }

     /* Layout split: painel decorativo + card de login */
     .wrap{
       min-height:100vh;
       display:grid;
       grid-template-columns:1.05fr .95fr;
       align-items:stretch;
     }
     .aside{
       position:relative;
       overflow:hidden;
       background:linear-gradient(150deg, var(--primary), var(--primary-dark));
       color:#fff;
       padding:56px 48px;
       display:flex;
       flex-direction:column;
       justify-content:center;
       gap:18px;
     }
     .aside::after{
       content:'';
       position:absolute;inset:0;
       background:
         radial-gradient(500px 300px at 85% 20%, rgba(255,255,255,.22), transparent 60%),
         radial-gradient(400px 320px at 10% 90%, rgba(255,255,255,.14), transparent 60%);
       pointer-events:none;
     }
     .aside .big{font-size:clamp(28px,3.2vw,44px); font-weight:1000; letter-spacing:-.03em; line-height:1.1; position:relative;}
     .aside .lead{font-size:15px; font-weight:600; opacity:.95; max-width:34ch; line-height:1.55; position:relative;}
     .aside .shelf{display:flex; gap:10px; margin-top:8px; position:relative; flex-wrap:wrap;}
     .aside .shelf .book{
       width:26px;height:74px;border-radius:6px;
       background:rgba(255,255,255,.25); border:1px solid rgba(255,255,255,.35);
       box-shadow:inset 0 -14px 0 rgba(255,255,255,.18);
     }
     .aside .shelf .book:nth-child(2){height:64px;background:rgba(255,255,255,.35);}
     .aside .shelf .book:nth-child(3){height:82px;}
     .aside .shelf .book:nth-child(4){height:58px;background:rgba(255,255,255,.32);}
     .aside .shelf .book:nth-child(5){height:72px;}
     .aside .aside-logo{
       width:52px;height:52px;border-radius:15px;background:rgba(255,255,255,.18);
       border:1px solid rgba(255,255,255,.35); display:grid; place-items:center; font-size:26px;
     }

     .pane{
       display:grid;
       place-items:center;
       padding:32px 22px;
     }
     .card{
       width:100%;
       max-width:430px;
       background:var(--card);
       border:1px solid var(--border);
       border-radius:var(--radius);
       box-shadow:var(--shadow);
       padding:36px 32px 28px;
       animation:fadeIn 340ms ease both;
     }
     @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
     .brand{
       display:flex;
       flex-direction:column;
       align-items:center;
       text-align:center;
       gap:8px;
       margin-bottom:26px;
     }
     .logo{
       width:60px;height:60px;
       border-radius:18px;
       background:linear-gradient(135deg, var(--primary), var(--primary-dark));
       display:grid;place-items:center;
       font-size:30px;
       box-shadow:0 10px 26px rgba(21,128,61,.28);
       margin-bottom:4px;
     }
     .title{
       font-weight:1000;
       letter-spacing:-.02em;
       font-size:22px;
     }
     .subtitle{color:var(--muted); font-weight:700; font-size:13px;}

     label{display:block; font-size:12px; color:var(--muted); font-weight:800; margin:16px 0 7px;}

     .input-wrap{position:relative;}
     .input-wrap .field-ico{position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:15px; opacity:.6; pointer-events:none;}
     input[type=email],input[type=text],input[type=password]{
       width:100%;
       height:50px;
       border:1.5px solid var(--border);
       border-radius:13px;
       padding:0 46px 0 40px;
       background:#fff;
       color:var(--text);
       outline:none;
       font-weight:600;
       font-size:14.5px;
       transition:border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
     }
     input::placeholder{color:#9CA3AF; font-weight:500;}
     input:hover{border-color:#CBD5E1;}
     input:focus{border-color:rgba(34,197,94,.75); box-shadow:0 0 0 4px rgba(34,197,94,.16); background:#fff;}
     input.erro{border-color:var(--danger); box-shadow:0 0 0 4px rgba(239,68,68,.12);}

     .toggle-senha{
       position:absolute;
       right:8px;top:50%;
       transform:translateY(-50%);
       background:none;border:0;
       cursor:pointer;
       font-size:16px;
       padding:8px 10px;
       border-radius:9px;
       line-height:1;
       color:var(--muted);
       transition:background 140ms ease;
     }
     .toggle-senha:hover{background:#F1F5F9;}
     .toggle-senha:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}

     button.entrar{
       width:100%;
       border:0;
       border-radius:13px;
       height:50px;
       padding:0 14px;
       cursor:pointer;
       font-weight:800;
       font-size:15px;
       color:#fff;
       background:var(--primary);
       transition:transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
       display:inline-flex;
       align-items:center;
       justify-content:center;
       gap:9px;
       user-select:none;
       margin-top:24px;
       letter-spacing:.01em;
     }
     button.entrar:hover{background:var(--primary-dark); transform:translateY(-1px); box-shadow:0 14px 28px rgba(21,128,61,.22);}
     button.entrar:active{transform:translateY(0);}
     button.entrar:disabled{opacity:.7; cursor:not-allowed; transform:none; box-shadow:none;}

     /* Spinner de loading no botão */
     .spinner{
       width:17px;height:17px;border-radius:50%;
       border:2.5px solid rgba(255,255,255,.4);
       border-top-color:#fff;
       animation:spin 700ms linear infinite;
       display:none;
     }
     @keyframes spin{to{transform:rotate(360deg);}}
     button.entrar.loading .spinner{display:inline-block;}

     .msg{
       margin-top:16px;
       font-weight:700;
       font-size:13px;
       color:var(--muted);
       min-height:18px;
       text-align:center;
       border-radius:11px;
       padding:0 4px;
       transition: color 160ms ease;
     }
     .msg.error{
       color:var(--danger-dark);
       background:rgba(239,68,68,.08);
       border:1px solid rgba(239,68,68,.25);
       padding:10px 12px;
     }
     .msg.success{
       color:var(--primary-dark);
       background:rgba(34,197,94,.10);
       border:1px solid rgba(34,197,94,.3);
       padding:10px 12px;
     }

     .foot{
       margin-top:22px;
       font-size:11.5px;
       font-weight:600;
       color:var(--muted);
       text-align:center;
       line-height:1.6;
     }

     /* Tablet / celular: esconde o painel decorativo */
     @media (max-width:920px){
       .wrap{grid-template-columns:1fr;}
       .aside{display:none;}
       .pane{padding:24px 16px;}
     }
     @media (max-width:420px){
       .card{padding:28px 20px 22px; border-radius:16px;}
       .logo{width:54px;height:54px;font-size:26px;}
       .title{font-size:20px;}
     }
     @media (prefers-color-scheme: dark){
       :root{
         --bg:#0B1220; --card:#0F172A; --border:#1E293B; --text:#E2E8F0; --muted:#94A3B8;
       }
       body{background:radial-gradient(1100px 620px at 8% -12%, rgba(34,197,94,.14), transparent 60%), radial-gradient(900px 560px at 112% 112%, rgba(59,130,246,.12), transparent 60%), var(--bg);}
       input[type=email],input[type=text],input[type=password]{background:#0B1220; color:var(--text);}
     }
  </style>
</head>
<body>
  <div class="wrap">
     <!-- Painel decorativo (oculto em telas pequenas) -->
     <aside class="aside" aria-hidden="true">
       <div class="aside-logo">📚</div>
       <div class="big">Sistema da<br/>Biblioteca Escolar</div>
       <div class="lead">Gestão de acervo, alunos, empréstimos e devoluções — simples e segura para o dia a dia da biblioteca.</div>
       <div class="shelf">
         <span class="book"></span><span class="book"></span><span class="book"></span>
         <span class="book"></span><span class="book"></span>
       </div>
     </aside>

     <!-- Card de login -->
     <div class="pane">
       <div class="card" role="form" aria-label="Tela de login">
         <div class="brand">
           <div class="logo">📚</div>
           <div class="title">Sistema Biblioteca</div>
           <div class="subtitle">Entre com seu e-mail e senha</div>
         </div>

         <form id="loginForm" novalidate>
           <div>
             <label for="email">E-mail</label>
             <div class="input-wrap">
               <span class="field-ico">✉️</span>
               <input id="email" type="email" autocomplete="username" inputmode="email" placeholder="seu.nome@escola.exemplo" required />
             </div>
           </div>
           <div>
             <label for="password">Senha</label>
             <div class="input-wrap">
               <span class="field-ico">🔒</span>
               <input id="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required />
               <button type="button" class="toggle-senha" id="toggleSenha" title="Mostrar / ocultar senha" aria-label="Mostrar ou ocultar senha">👁️</button>
             </div>
           </div>

           <button type="submit" id="loginBtn" class="entrar">
             <span class="spinner" aria-hidden="true"></span>
             <span id="loginBtnText">Entrar</span>
           </button>

           <div class="msg" id="loginMsg" role="alert" aria-live="polite"></div>

           <div class="foot">
             Acesso restrito à equipe da biblioteca.<br/>
             Esqueceu a senha? Procure a administração do sistema.
           </div>
         </form>
       </div>
     </div>
  </div>

  <script>
    const $ = (sel) => document.querySelector(sel);

    function setMsg(msg, tipo){
      const el = $('#loginMsg');
      el.textContent = msg || '';
      el.classList.remove('error','success');
      if (tipo) el.classList.add(tipo);
    }


    // Mensagem de sessão expirada vinda do index.html (?sessao=expirada)
    (function(){
      const p = new URLSearchParams(location.search);
      if (p.get('sessao') === 'expirada') {
        setMsg('Sua sessão expirou. Faça login novamente.', 'error');
      }
    })();

    // Se já existe uma sessão válida NO SERVIDOR, vai direto para o site.
    // (O localStorage NÃO é fonte de verdade, para evitar loop de redirecionamento)
    (async function(){
      try {
        const res = await fetch('/api/auth/session', { credentials: 'include' });
        if (res.ok) location.replace('./index.html');
      } catch (e) { /* servidor indisponível */ }
    })();

    // Mostrar / ocultar senha
    $('#toggleSenha').addEventListener('click', () => {
      const inp = $('#password');
      const visivel = inp.type === 'text';
      inp.type = visivel ? 'password' : 'text';
      $('#toggleSenha').textContent = visivel ? '👁️' : '🙈';
    });

    let csrfToken = null;
    (async () => { csrfToken = await obterCsrfToken(); })();

    // Login sempre na mesma origem em que a página foi aberta.
    // (Nada de tentar outras portas: o cookie de sessão ficaria gravado em
    // outra porta e o index.html derrubaria a sessão, causando loop de redirecionamento)
    // Obtém o token CSRF da sessão (necessário para o POST de login).
    async function obterCsrfToken() {
      try {
        const res = await fetch('/api/auth/csrf', { credentials: 'include' });
        if (res.ok) { const d = await res.json(); return d.csrfToken || null; }
      } catch (e) { /* ignore */ }
      return null;
    }

    async function tryAuthRequest(email, password) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);
      try {
        const headers = { 'Content-Type': 'application/json' };
        if (csrfToken) headers['X-CSRF-Token'] = csrfToken;
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers,
          body: JSON.stringify({ email, password }),
          signal: controller.signal,
          credentials: 'include'
        });
        clearTimeout(timeoutId);
        return res;
      } catch (e) {
        clearTimeout(timeoutId);
        return null;
      }
    }

    async function loginUser(email, password) {
      const btn = $('#loginBtn');
      const btnText = $('#loginBtnText');
      btn.disabled = true;
      btn.classList.add('loading');
      if (btnText) btnText.textContent = 'Entrando...';
      setMsg('');

      try {
        if (location.protocol === 'file:') {
          setMsg('Abra o site pelo servidor (http://localhost:3000). Não funciona abrindo o arquivo direto.', 'error');
          return;
        }

        // Garante que temos um token CSRF válido para esta sessão.
        if (!csrfToken) csrfToken = await obterCsrfToken();

        const response = await tryAuthRequest(email, password);

        if (!response) {
          setMsg('Não foi possível conectar ao servidor. Verifique se o sistema está rodando.', 'error');
          return;
        }

        let data = null;
        try { data = await response.json(); } catch(err) { data = null; }

        if (response.ok && data && data.ok) {
          setMsg('Login realizado com sucesso! Redirecionando...', 'success');
          location.replace('./index.html');
          return;
        }

        // Mensagem sempre genérica (evita enumeração de usuários).
        setMsg((data && data.error) || 'E-mail ou senha inválidos.', 'error');
      } catch (err) {
        setMsg('Não foi possível conectar ao servidor. Verifique se o sistema está rodando.', 'error');
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
        if (btnText) btnText.textContent = 'Entrar';
      }
    }

    $('#loginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const u = ($('#email').value || '').trim();
      const p = $('#password').value || '';

      $('#email').classList.remove('erro');
      $('#password').classList.remove('erro');

      if (!u) { setMsg('Informe o e-mail.', 'error'); $('#email').classList.add('erro'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u)) {
        setMsg('Informe um e-mail válido.', 'error'); $('#email').classList.add('erro'); return;
      }
      if (!p) { setMsg('Informe a senha.', 'error'); $('#password').classList.add('erro'); return; }

      loginUser(u, p);
    });
  </script>
</body>
</html>
